<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#050816,#0f172a,#1e293b);
    overflow:hidden;
    color:#fff;
}

/* Animated Background */
body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:#00d9ff33;
    border-radius:50%;
    filter:blur(120px);
    animation:move1 8s infinite alternate;
}

body::after{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:#7c3aed33;
    border-radius:50%;
    filter:blur(120px);
    animation:move2 10s infinite alternate;
}

@keyframes move1{
    from{transform:translate(-250px,-200px);}
    to{transform:translate(250px,200px);}
}

@keyframes move2{
    from{transform:translate(250px,200px);}
    to{transform:translate(-250px,-200px);}
}

.card{
    position:relative;
    width:90%;
    max-width:600px;
    text-align:center;
    padding:45px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
    z-index:1;
}

.icon{
    font-size:80px;
    animation:float 2s ease-in-out infinite;
}

@keyframes float{
    50%{
        transform:translateY(-12px);
    }
}

h1{
    font-size:42px;
    margin:20px 0 10px;
}

p{
    color:#cbd5e1;
    font-size:18px;
    line-height:1.7;
}

.badge{
    display:inline-block;
    margin-top:25px;
    padding:10px 25px;
    border-radius:50px;
    background:#00d9ff;
    color:#000;
    font-weight:bold;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
        box-shadow:0 0 25px #00d9ff;
    }
}

.footer{
    margin-top:30px;
    color:#94a3b8;
    font-size:14px;
}
</style>
</head>
<body>

<div class="card">

<div class="icon">🚧</div>

<h1>Coming Soon</h1>

<p>
This feature is currently under development.<br>
Our team is working hard to bring you an amazing experience.
</p>

<div class="badge">
🚀 Still Not Prepared
</div>

<div class="footer">
Please check back later.
</div>

</div>

</body>
</html>
